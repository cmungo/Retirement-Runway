document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-gradient(90deg,#E0B143,#F0D38C);transition:width .5s cubic-bezier(.4,0,.2,1);width:{{ progressPct }}\"><\u002Fdiv>\n<div style=\"position:relative;display:flex;justify-content:space-between;width:100%\">\n<sc-for list=\"{{ checkpointDots }}\" as=\"d\" hint-placeholder-count=\"5\">\n<span style=\"width:12px;height:12px;border-radius:999px;border:1px solid #E0B143;background:{{ d.fill }};display:block\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align:center;margin-top:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0E2148;font-weight:600\">{{ activeCheckpointLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ sampleMode }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#FBEDD8;border:1px solid #F0D38C;border-radius:12px;padding:8px 10px\">\n<span style=\"font-size:13px;font-weight:600;color:#C97A1A;flex:1;min-width:140px\">Sample Household — demonstration data<\u002Fspan>\n<button class=\"btn\" style=\"min-height:38px;font-size:13px;background:#fff;border:1px solid #E0B143;color:#C97A1A;flex:none\" sc-camel-on-click=\"{{ exitSample }}\">Exit Sample and Start My Own<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fheader>\n\n<main style=\"flex:1;overflow-y:auto;padding:22px 18px 28px\" data-screen-label=\"{{ screenLabel }}\">\n\n\n<sc-if value=\"{{ s_welcome }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:22px;animation:rrIn .4s ease both\">\n<div class=\"blueprint\" style=\"padding:22px 18px 26px;position:relative;overflow:hidden\">\n<i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"eyebrow-rule\" style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--sky-teal-700)\">An educational planning experience<\u002Fdiv>\n<h1 style=\"font-size:38px;margin:12px 0 0;text-wrap:pretty\">See how well your retirement lifestyle is supported.<\u002Fh1>\n<p style=\"font-size:17px;line-height:1.55;margin:14px 0 0;color:var(--color-neutral-800);text-wrap:pretty\">Build a simple picture of your expenses, dependable income, savings, priorities, and potential retirement risks.<\u002Fp>\n<div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px\">\n<sc-for list=\"{{ welcomeMarks }}\" as=\"m\" hint-placeholder-count=\"5\">\n<div style=\"text-align:center\">\n<span style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-500);display:block\">{{ m.short }}<\u002Fspan>\n<span style=\"font-size:10.5px;color:var(--color-neutral-400);display:block;margin-top:2px;line-height:1.25\">{{ m.desc }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ trustPoints }}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;gap:10px;align-items:flex-start\">\n<span style=\"width:20px;height:20px;flex:none;margin-top:2px;border-radius:999px;background:#FBEDD8;border:1px solid #F0D38C;display:grid;place-items:center;font-size:12px;color:#C97A1A\">✓<\u002Fspan>\n<span style=\"font-size:16px\">{{ t.label }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center\">\n<button class=\"btn btn-primary btn-block\" style=\"min-height:56px;font-size:18px;font-weight:600\" sc-camel-on-click=\"{{ startFlow }}\">Build My Retirement Runway<\u002Fbutton>\n<a href=\"#\" sc-camel-on-click=\"{{ goHow }}\" style=\"font-size:14.5px;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:3px\">See how it works<\u002Fa>\n<a href=\"#\" sc-camel-on-click=\"{{ loadSample }}\" style=\"font-size:13.5px;color:var(--color-neutral-600);text-decoration:underline;text-underline-offset:3px\">Prefer to explore first? View a sample household.<\u002Fa>\n<sc-if value=\"{{ hasData }}\" hint-placeholder-val=\"{{ false }}\">\n<a href=\"#\" sc-camel-on-click=\"{{ askReset }}\" style=\"font-size:13px;color:var(--color-neutral-500);text-decoration:underline;text-underline-offset:3px\">Start over<\u002Fa>\n<\u002Fsc-if>\n<\u002Fdiv>\n<p style=\"font-size:12.5px;line-height:1.6;color:var(--color-neutral-500);margin:0;text-align:center\">{{ disclosure }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_how }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px;animation:rrIn .4s ease both\">\n<div>\n<div class=\"eyebrow-rule\" style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--sky-teal-700)\">How it works<\u002Fdiv>\n<h2 style=\"font-size:30px;margin:10px 0 0\">Five checkpoints, about five minutes.<\u002Fh2>\n<p style=\"font-size:16px;margin:10px 0 0;color:var(--color-neutral-800);text-wrap:pretty\">Enter approximate amounts. Anything you do not know can be marked unknown and skipped — nothing is assumed for you.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0\">\n<sc-for list=\"{{ howSteps }}\" as=\"h\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--color-divider)\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n<span class=\"blueprint\" style=\"width:32px;height:32px;display:grid;place-items:center;font-family:var(--font-heading);font-size:16px;color:var(--color-accent-800)\">{{ h.n }}<\u002Fspan>\n<span style=\"flex:1;width:1px;background:repeating-linear-gradient(180deg,var(--color-neutral-400) 0 5px,transparent 5px 10px)\"><\u002Fspan>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--font-heading);font-size:20px\">{{ h.title }}<\u002Fdiv>\n<div style=\"font-size:15px;color:var(--color-neutral-700);margin-top:3px;text-wrap:pretty\">{{ h.body }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button class=\"btn btn-primary btn-block\" style=\"min-height:54px;font-size:18px\" sc-camel-on-click=\"{{ startFlow }}\">Start My Assessment<\u002Fbutton>\n<button class=\"btn btn-ghost btn-block\" style=\"min-height:46px;font-size:15px\" sc-camel-on-click=\"{{ goWelcome }}\">Back to start<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_household }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:18px;animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">A little about your household<\u002Fh2>\n<p style=\"font-size:16px;margin:8px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">Approximate answers are fine. We never ask for a date of birth, account numbers, or Social Security numbers.<\u002Fp>\n<\u002Fdiv>\n<div class=\"field\"><label style=\"font-size:14px\">First name<\u002Flabel>\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" placeholder=\"Margaret\" value=\"{{ p_firstName }}\" sc-camel-on-change=\"{{ onFirstName }}\"><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div class=\"field\"><label style=\"font-size:14px\">Current age<\u002Flabel>\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" inputmode=\"numeric\" placeholder=\"62\" value=\"{{ p_age }}\" sc-camel-on-change=\"{{ onAge }}\"><\u002Fdiv>\n<div class=\"field\"><label style=\"font-size:14px\">Planned retirement age<\u002Flabel>\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" inputmode=\"numeric\" placeholder=\"65\" value=\"{{ p_retireAge }}\" sc-camel-on-change=\"{{ onRetireAge }}\"><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ ageError }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"blueprint\" style=\"padding:12px 14px;border-color:#F0D38C;background:#FDF9F1;font-size:14.5px;color:#C97A1A;display:flex;gap:8px\"><span aria-hidden=\"true\">!<\u002Fspan><span>{{ ageErrorText }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"field\"><label style=\"font-size:14px\">Retirement status<\u002Flabel>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ statusOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n<button class=\"btn\" style=\"min-height:48px;font-size:16px;justify-content:flex-start;text-align:left;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"field\"><label style=\"font-size:14px\">Marital or partner status<\u002Flabel>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ maritalOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n<button class=\"btn\" style=\"min-height:48px;font-size:16px;flex:1 1 30%;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ isPartnered }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"field\"><label style=\"font-size:14px\">Spouse or partner age<\u002Flabel>\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" inputmode=\"numeric\" placeholder=\"60\" value=\"{{ p_spouseAge }}\" sc-camel-on-change=\"{{ onSpouseAge }}\"><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ spouseNotice }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"blueprint\" style=\"padding:12px 14px;border-color:#F0D38C;background:#FDF9F1;font-size:14.5px;color:#C97A1A\">You entered spouse or partner details but selected “Single.” Choose “Married” or “Partnered” to keep those answers, or they will be left out of your results.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div class=\"field\"><label style=\"font-size:14px\">State<\u002Flabel>\n<sc-raw-select class=\"input\" style=\"min-height:48px;font-size:17px\" value=\"{{ p_state }}\" sc-camel-on-change=\"{{ onState }}\">\n<sc-for list=\"{{ stateOpts }}\" as=\"s\" hint-placeholder-count=\"6\"><option value=\"{{ s.v }}\">{{ s.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select><\u002Fdiv>\n<div class=\"field\"><label style=\"font-size:14px\">Your home<\u002Flabel>\n<div style=\"display:flex;gap:8px\">\n<sc-for list=\"{{ homeOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n<button class=\"btn\" style=\"min-height:48px;font-size:16px;flex:1;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"field\"><label style=\"font-size:14px\">Do you expect to move during retirement?<\u002Flabel>\n<div style=\"display:flex;gap:8px\">\n<sc-for list=\"{{ moveOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n<button class=\"btn\" style=\"min-height:48px;font-size:16px;flex:1;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{ householdMissing }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"blueprint\" style=\"padding:12px 14px;border-color:#F0D38C;background:#FDF9F1;font-size:14.5px;color:#C97A1A\">Please add your first name and current age so the rest of the questions can be tailored to you.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_vision }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px;animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">What matters most to you?<\u002Fh2>\n<p style=\"font-size:16px;margin:8px 0 0;color:var(--color-neutral-700)\">Choose as many as you like. There is no single right answer.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ goalOpts }}\" as=\"o\" hint-placeholder-count=\"11\">\n<button class=\"btn\" style=\"min-height:46px;font-size:15px;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.toggle }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"hr\"><\u002Fdiv>\n<div>\n<h3 style=\"font-size:23px;margin:0\">What concerns you most about retirement?<\u002Fh3>\n<p style=\"font-size:15px;margin:6px 0 0;color:var(--color-neutral-700)\">Your answers shape which scenarios we suggest testing later.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ concernOpts }}\" as=\"o\" hint-placeholder-count=\"10\">\n<button class=\"btn\" style=\"min-height:46px;font-size:15px;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.toggle }}\">{{ o.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:14.5px;color:var(--color-neutral-700)\">{{ visionSummary }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_essentials }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">Monthly essential expenses<\u002Fh2>\n<p style=\"font-size:15.5px;margin:8px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">Essential expenses are costs the household would still need to pay even if discretionary spending were reduced. Use the suggested estimate if you are unsure, or mark an item unknown.<\u002Fp>\n<\u002Fdiv>\n<div>\n<sc-for list=\"{{ essRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n<div style=\"display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--color-divider)\">\n<div><div style=\"font-size:16.5px;font-weight:500\">{{ r.label }}<\u002Fdiv><div style=\"font-size:13.5px;color:var(--color-neutral-600)\">{{ r.help }}<\u002Fdiv><\u002Fdiv>\n<input class=\"input\" style=\"min-height:48px;font-size:17px;text-align:right\" inputmode=\"decimal\" placeholder=\"$0\" aria-label=\"{{ r.label }}\" value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" disabled=\"{{ r.unknown }}\">\n<div style=\"grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap\">\n<button class=\"btn btn-secondary\" style=\"min-height:38px;font-size:13px\" sc-camel-on-click=\"{{ r.useSuggest }}\">{{ r.suggestLabel }}<\u002Fbutton>\n<button class=\"btn\" style=\"min-height:38px;font-size:13px;background:{{ r.ubg }};border-color:{{ r.ubd }};color:{{ r.ufg }}\" sc-camel-on-click=\"{{ r.toggleUnknown }}\">{{ r.unknownLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"blueprint\" style=\"padding:14px\">\n<div style=\"font-size:14px;color:var(--color-neutral-700);margin-bottom:8px\">Add a custom essential expense<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 110px;gap:8px\">\n<input class=\"input\" style=\"min-height:46px;font-size:16px\" placeholder=\"Storage unit\" value=\"{{ customLabel }}\" sc-camel-on-change=\"{{ onCustomLabel }}\">\n<input class=\"input\" style=\"min-height:46px;font-size:16px;text-align:right\" inputmode=\"decimal\" placeholder=\"$0\" value=\"{{ customAmount }}\" sc-camel-on-change=\"{{ onCustomAmount }}\">\n<\u002Fdiv>\n<button class=\"btn btn-secondary btn-block\" style=\"min-height:44px;font-size:14px\" sc-camel-on-click=\"{{ addCustom }}\">Add expense<\u002Fbutton>\n<sc-for list=\"{{ customRows }}\" as=\"c\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;align-items:center;gap:10px;padding-top:10px;font-size:15px\">\n<span style=\"flex:1\">{{ c.label }}<\u002Fspan><span>{{ c.amount }}<\u002Fspan>\n<button class=\"btn btn-ghost\" style=\"min-height:38px;font-size:13px\" sc-camel-on-click=\"{{ c.remove }}\">Remove<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ emptyEss }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"blueprint\" style=\"padding:14px;border-color:var(--color-neutral-400);font-size:15px;color:var(--color-neutral-700)\">Nothing entered yet. Tap a suggested estimate to get started — you can refine the numbers at any time.<\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"blueprint\" style=\"position:sticky;bottom:-2px;background:var(--color-bg);padding:14px;display:flex;align-items:center;justify-content:space-between\">\n<div><div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Essential monthly expenses<\u002Fdiv>\n<div style=\"font-size:13px;color:var(--color-neutral-600)\">{{ essUnknownNote }}<\u002Fdiv><\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-weight:500;letter-spacing:-.03em;font-size:32px;color:var(--color-accent-900)\">{{ essTotalText }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_lifestyle }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">Monthly lifestyle expenses<\u002Fh2>\n<p style=\"font-size:15.5px;margin:8px 0 0;color:var(--color-neutral-700)\">The spending that makes retirement enjoyable — the part you would most want to protect.<\u002Fp>\n<\u002Fdiv>\n<div>\n<sc-for list=\"{{ lifeRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n<div style=\"display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--color-divider)\">\n<div><div style=\"font-size:16.5px;font-weight:500\">{{ r.label }}<\u002Fdiv><div style=\"font-size:13.5px;color:var(--color-neutral-600)\">{{ r.help }}<\u002Fdiv><\u002Fdiv>\n<input class=\"input\" style=\"min-height:48px;font-size:17px;text-align:right\" inputmode=\"decimal\" placeholder=\"$0\" aria-label=\"{{ r.label }}\" value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" disabled=\"{{ r.unknown }}\">\n<div style=\"grid-column:1 / -1;display:fle animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">Dependable monthly income<\u002Fh2>\n<p style=\"font-size:15.5px;margin:8px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">Dependable income is income you reasonably expect to receive regularly — not income that depends solely on withdrawing from market investments.<\u002Fp>\n<\u002Fdiv>\n<div>\n<sc-for list=\"{{ incomeRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n<div style=\"display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--color-divider)\">\n<div><div style=\"font-size:16.5px;font-weight:500\">{{ r.label }}<\u002Fdiv><div style=\"font-size:13.5px;color:var(--color-neutral-600)\">{{ r.help }}<\u002Fdiv><\u002Fdiv>\n<input class=\"input\" style=\"min-height:48px;font-size:17px;text-align:right\" inputmode=\"decimal\" placeholder=\"$0\" aria-label=\"{{ r.label }}\" value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" disabled=\"{{ r.unknown }}\">\n<div style=\"grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap\">\n<button class=\"btn btn-secondary\" style=\"min-height:38px;font-size:13px\" sc-camel-on-click=\"{{ r.useSuggest }}\">{{ r.suggestLabel }}<\u002Fbutton>\n<button class=\"btn\" style=\"min-height:38px;font-size:13px;background:{{ r.ubg }};border-color:{{ r.ubd }};color:{{ r.ufg }}\" sc-camel-on-click=\"{{ r.toggleUnknown }}\">{{ r.unknownLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ hasPension }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"blueprint\" style=\"padding:16px;display:flex;flex-direction:column;gap:14px\">\n<i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div><div style=\"font-family:var(--font-heading);font-size:20px\">About your pension<\u002Fdiv>\n<div style=\"font-size:14px;color:var(--color-neutral-700)\">Optional, and easy to gn:right\" inputmode=\"decimal\" placeholder=\"$0\" aria-label=\"{{ r.label }}\" value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\">\n<\u002Fsc-if>\n<sc-if value=\"{{ r.showRange }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-raw-select class=\"input\" style=\"min-height:46px;font-size:16px\" value=\"{{ r.range }}\" sc-camel-on-change=\"{{ r.onRange }}\">\n<sc-for list=\"{{ r.rangeOpts }}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fsc-if>\n<sc-if value=\"{{ r.unknown }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:14px;color:#C97A1A\">Marked unknown — this will be listed in your missing information, not counted as zero.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div class=\"blueprint\" style=\"padding:14px;display:flex;justify-content:space-between;align-items:center\">\n<div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)\">Total entered resources<\u002Fdiv>\n<div style=\"font-family:var(--font-heading);font-weight:500;letter-spacing:-.03em;font-size:28px;color:var(--color-accent-900)\">{{ assetsTotalText }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ s_liquidity }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:18px;animation:rrIn .35s ease both\">\n<div>\n<h2 style=\"font-size:29px;margin:0\">How much do you want kept accessible?<\u002Fh2>\n<p style=\"font-size:15.5px;margin:8px 0 0;color:var(--color-neutral-700)\">Money you could reach quickly, without selling investments at a bad moment.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ liqOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n<button class=\"btn\" style=\"min-height:50px;font-size:16px;justify-content:space-between;background:{{ o.bg }};border-color:{{ o.bd }};color:{{ o.fg }}\" sc-camel-on-click=\"{{ o.pick }}\"><span>{{ o.label }}<\u002Fspan><span style=\"opacity:.75\">{{ o.amount }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ liqCustom }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"field\"><label style=\"font-size:14px\">Custom amount to keep accessible<\u002Flabel>\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" inputmode=\"decimal\" placeholder=\"$40,000\" value=\"{{ liqCustomVal }}\" sc-camel-on-change=\"{{ onLiqCustom }}\"><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"hr\"><\u002Fdiv>\n<div>\n<h3 style=\"font-size:22px;margin:0\">Any large expenses you expect?<\u002Fh3>\n<p style=\"font-size:15px;margin:6px 0 0;color:var(--color-neutral-700)\">Add an approximate amount and when you expect it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:10px\">\n<sc-raw-select class=\"input\" style=\"min-height:48px;font-size:16px\" value=\"{{ bigType }}\" sc-camel-on-change=\"{{ onBigType }}\">\n<sc-for list=\"{{ bigTypeOpts }}\" as=\"o\" hint-placeholder-count=\"9\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n<input class=\"input\" style=\"min-height:48px;font-size:17px\" inputmode=\"decimal\" placeholder=\"$15,000\" aria-label=\"Approximate amount\" value=\"{{ bigAmount }}\" sc-camel-on-change=\"{{ onBigAmount }}\">\n<sc-raw-select class=\"input\" style=\"min-height:48px;font-size:16px\" value=\"{{ bigWhen }}\" sc-camel-on-change=\"{{ onBigWhen }}\">\n<sc-for list=\"{{ bigWhenOpts }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<button class=\"btn btn-secondary btn-block\" style=\"min-height:46px;font-size:15px\" sc-camel-on-click=\"{{ addBig }}\">Add expected expense<\u002Fbutton>\n<\u002Fdiv>\n<sc-for list=\"{{ bigRows ot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:940}}\">\nclass Component extends DCLogic {\n  essCats = [\n    {k:'housing',label:'Housing',help:'Rent or mortgage payment',s:1750},\n    {k:'utilities',label:'Utilities',help:'Electric, gas, water, internet, phone',s:300},\n    {k:'groceries',label:'Groceries',help:'Food and household basics',s:650},\n    {k:'transportation',label:'Transportation',help:'Fuel, upkeep, car payment, transit',s:420},\n    {k:'healthcare',label:'Healthcare',help:'Premiums, prescriptions, routine care',s:520},\n    {k:'insurance',label:'Insurance',help:'Auto, home, life',s:260},\n    {k:'debt',label:'Minimum debt payments',help:'Cards and loans — minimum only',s:250},\n    {k:'proptax',label:'Property taxes or fees',help:'Monthly equivalent, incl. association dues',s:400},\n    {k:'famsupport',label:'Family support',help:'Regular help you already provide',s:300},\n    {k:'otherEss',label:'Other essentials',help:'Anything else you must pay',s:350}\n  ];\n  lifeCats = [\n    {k:'travel',label:'Travel',help:'Trips and visits',s:600},\n    {k:'restaurants',label:'Restaurants',help:'Dining out and takeout',s:350},\n    {k:'entertainment',label:'Entertainment',help:'Events, streaming, outings',s:150},\n    {k:'hobbies',label:'Hobbies',help:'Golf, garden, workshop, classes',s:120},\n    {k:'gifts',label:'Gifts',help:'Family and holidays',s:150},\n    {k:'homeimp',label:'Home improvements',help:'Projects and upgrades',s:200},\n    {k:'memberships',label:'Memberships',help:'Clubs, gym, subscriptions',s:80},\n    {k:'personal',label:'Personal spending',help:'Clothing, gifts to self, misc.',s:100},\n    {k:'charity',label:'Charitable giving',help:'Regular donations',s:50},\n    {k:'otherLife',label:'Other lifestyle',help:'Anything else you would like to keep',s:0}\n  ];\n  incomeCats = [\n    {k:'userSS',label:'Your Social Security',help:'Estimated monthly benefit',s:2100,cola:true},\n    {k:'spouseSS',label:'Spouse or partner Social Security',help:'Estimated monthly benefit',s:1400,cola:true,spouse:true},\n    {k:'pension',label:'Your pension',help:'Monthly benefit before taxes',s:1450},\n    {k:'spousePension',label:'Spouse or partner pension',help:'Monthly benefit before taxes',s:0,spouse:true},\n    {k:'annuityInc',label:'Existing annuity income',help:'Payments you already receive',s:0},\n    {k:'rental',label:'Rental income',help:'Net of expenses',s:714},\n    {k:'otherInc',label:'Other dependable income',help:'Trust, royalty, part-time contract',s:0}\n  ];\n  assetCats = [\n    {k:'checking',label:'Checking and savings',b:'cash',s:45000},\n    {k:'cds',label:'CDs',b:'cash',s:30000},\n    {k:'brokerage',label:'Brokerage accounts',b:'market',s:120000},\n    {k:'tradIra',label:'Traditional IRA',b:'retire',s:380000},\n    {k:'roth',label:'Roth IRA',b:'retire',s:90000},\n    {k:'plan401k',label:'401(k), 403(b), or 457 plan',b:'retire',s:170000},\n    {k:'annuityVal',label:'Existing annuity value',b:'ins',s:0},\n    {k:'cashLife',label:'Cash-value life insurance',b:'ins',s:0},\n    {k:'otherAsset',label:'Other retirement assets',b:'retire',s:0}\n  ];\n  buckets = [\n    {b:'cash',title:'Immediately available cash',note:'Reachable within days'},\n    {b:'retire',title:'Retirement accounts',note:'Tax rules and timing apply'},\n    {b:'market',title:'Market-based investments',note:'Value moves with markets'},\n    {b:'ins',title:'Insurance and annuity assets',note:'Contract terms may apply'}\n  ];\n  ranges = [\n    {v:'',label:'Choose a range',n:0},\n    {v:'a',label:'Less than $25,000',n:12500},\n    {v:'b',label:'$25,000 to $99,999',n:62500},\n    {v:'c',label:'$100,000 to $249,999',n:175000},\n    {v:'d',label:'$250,000 to $499,999',n:375000},\n    {v:'e',label:'$500,000 to $999,999',n:750000},\n    {v:'f',label:'$1 million to $2 million',n:1500000},\n    {v:'g',label:'More than $2 million',n:2500000}\n  ];\n  prios = [\n    {k:'income',label:'Dependable lifetime income',short:'dependable income'},\n    {k:'access',label:'Access to money',short:'access to money'},\n    {k:'growth',label:'Growth potential',short:'growth potential'},\n    {k:'protection',label:'Protection from market losses',short:'protection from market losses'},\n    {k:'legacy',label:'Leaving an inheritance',short:'leaving an inheritance'},\n    {k:'inflation',label:'Inflation protection',short:'inflation protection'},\n    {k:'simplicity',label:'Simplicity',short:'simplicity'}\n  ];\n  flow = ['household','vision','essentials','lifestyle','income','resources','liquidity','priorities','couple','shocks','review','results','map','plan','report','advisor','done'];\n  sectionOf = {household:0,vision:0,essentials:1,lifestyle:1,income:2,resources:3,liquidity:3,priorities:4,couple:4,shocks:4,review:4,results:4,map:4,plan:4,report:4,advisor:4,done:4};\n  screenTitles = {welcome:'Welcome',how:'How it works',household:'Your household',vision:'Your household',essentials:'Your lifestyle',lifestyle:'Your lifestyle',income:'Your income',resources:'Your resources',liquidity:'Your resources',priorities:'Your runway',couple:'Your runway',shocks:'Your runway',review:'Your runway',results:'Your runway',map:'Your runway',plan:'Your runway',report:'Your runway',advisor:'Your runway',done:'Your runway'};\n  nextLabels = {household:'Continue',vision:'Continue',essentials:'Continue',lifestyle:'Continue',income:'Continue',resources:'Continue',liquidity:'Continue',priorities:'Continue',couple:'Continue',shocks:'View my Retirement Runway',review:'Looks right — continue',results:'View Runway Map',map:'View Action Plan',plan:'Preview Summary',report:'Request Professional Review',advisor:'Complete'};\n  stepTitles = {household:'Your household',vision:'Your priorities',essentials:'Your lifestyle',lifestyle:'Your lifestyle',income:'Your income',resources:'Your resources',liquidity:'Your resources',priorities:'Your priorities',couple:'Couple alignment',shocks:'Scenario testing',review:'Review',results:'Results',map:'Runway Map',plan:'Action Plan',report:'Summary',advisor:'Professional Review',done:'Complete'};\n\n  blankRows(cats){const o={};cats.forEach(c=>{o[c.k]={v:'',unknown:false};});return o;}\n  blankAssets(){const o={};this.assetCats.forEach(c=>{o[c.k]={mode:'exact',v:'',range:'',unknown:false};});return o;}\n\n  state = {\n    screen:'welcome', prev:'', attempted:false, toast:'', dialog:'', drag:'',\n    hsFormLoaded:false, hsFormError:false, hsFormSubmitted:false, sampleMode:false,\n    cfg:{APP_NAME:'Retirement Runway',APP_LOGO:'[APP_LOGO placeholder]',PRIMARY_COLOR:'#0E2148',SECONDARY_COLOR:'#E0B143',COMPANY_NAME:'Skyway Advisory',ADVISOR_NAME:'Charlie',CONTACT_EMAIL:'[CONTACT_EMAIL]',CONTACT_PHONE:'[CONTACT_PHONE]',LEAD_FORM_DESTINATION:'[LEAD_FORM_DESTINATION]',PRIVACY_POLICY_URL:'[PRIVACY_POLICY_URL]',TERMS_URL:'[TERMS_URL]',DISCLOSURE_TEXT:'Retirement Runway provides general educational estimates based on information entered by the user. It does not provide tax, legal, investment, insurance, or financial advice.'},\n    profile:{firstName:'',age:'',status:'',retireAge:'',marital:'',spouseAge:'',state:'',home:'',move:''},\n    goals:[], concerns:[],\n    ess:this.blankRows(this.essCats), life:this.blankRows(this.lifeCats), income:this.blankRows(this.incomeCats),\n    pension:{survivor:'',pct:'',cola:''},\n    assets:this.blankAssets(),\n    customs:[], newCustom:{label:'',amount:''},\n    liq:{choice:'',custom:'',items:[],draft:{type:'Home repairs',amount:'',when:'Within 1 year'}},\n    order:this.prios.map(p=>p.k),\n    partnerOrder:['income','access','simplicity','protection','inflation','legacy','growth'],\n    couple:{mode:''},\n    milestoneEdits:{},\n    shocks:{\n      early:{on:false,years:2},\n      market:{on:false,pct:20},\n      survivor:{on:false,ssKeep:'higher',expensePct:80},\n      health:{on:false,oneTime:'15000',monthly:'400',months:'24'},\n      inflation:{on:false,pct:10},\n      family:{on:false,monthly:'500',months:'24'}\n    },\n    contact:{firstName:'',email:'',phone:'',method:'',time:'',concern:'',consent:false,sent:false},\n    negNotice:false\n  };\n\n  componentDidMount(){\n    try{['rr_proto_v2','rr_proto_v1','rr_proto'].forEach(k=>window.localStorage.removeItem(k));}catch(e){}\n    try{const raw=window.sessionStorage.getItem('rr_session_v1');if(raw){const s=JSON.parse(raw);if(s&&s.profile)this.setState(s);}}catch(e){}\n    if(!window._rrHsLoaded){\n      window._rrHsLoaded=true;\n      window.addEventListener('message',e=>{if(e.data?.type==='hsFormCallback'){\n        if(e.data.eventName==='onFormSubmit')this.setState({hsFormSubmitted:true});\n      }});\n    }\n    if(!window._rrCalendlyLoaded){\n      window._rrCalendlyLoaded=true;\n      const s=document.createElement('script');\n      s.src='https://assets.calendly.com/assets/external/widget.js';\n      s.async=true;\n      document.head.appendChild(s);\n    }\n    this.setState({hsFormLoaded:true});\n  }\n  persist(){try{const s=Object.assign({},this.state);delete s.toast;delete s.dialog;window.sessionStorage.setItem('rr_session_v1',JSON.stringify(s));}catch(e){}}\n  saveState=()=>{this.persist();this.flash('Progress saved for this session.');};\n  flash(msg){this.setState({toast:msg});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:''}),1800);}\n\n  num(v){const x=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,''));return isFinite(x)?x:0;}\n  money(n){return '$'+Math.round(n).toLocaleString('en-US');}\n  money0(n){return n?this.money(n):'$0';}\n  pct(n){return Math.round(n)+'%';}\n\n  set(section,patch){this.setState(s=>({[section]:Object.assign({},s[section],patch)}));}\n  setRow(section,key,patch){this.setState(s=>({[section]:Object.assign({},s[section],{[key]:Object.assign({},s[section][key],patch)})}));}\n  onMoney(section,key){return e=>{const raw=e.target.value;if(/-/.test(raw))this.setState({negNotice:true});this.setRow(section,key,{v:raw.replace(/[^0-9.]/g,'')});};}\n\n  /* ── navigation ── */\n  visibleFlow(){const p=this.state.profile.marital;return this.flow.filter(f=>f!=='couple'||p==='married'||p==='partnered');}\n  go=(screen)=>{this.setState(s=>({screen:screen,prev:s.screen,attempted:false}));const m=document.querySelector('main');if(m)m.scrollTop=0;};\n  goNext=()=>{\n    const cur=this.state.screen;\n    if(cur==='household'){\n      const p=this.state.profile;\n      if(!p.firstName||!p.age||this.ageErr()){this.setState({attempted:true});return;}\n    }\n    const f=this.visibleFlow();const i=f.indexOf(cur);\n    this.persist();\n    if(i<0){this.go('household');return;}\n    this.go(f[Math.min(i+1,f.length-1)]);\n  };\n  goBack=()=>{\n    const cur=this.state.screen;\n    if(cur==='how'){this.go('welcome');return;}\n    const f=this.visibleFlow();const i=f.indexOf(cur);\n    if(i<=0){this.go('welcome');return;}\n    this.go(f[i-1]);\n  };\n\n  ageErr(){const a=this.num(this.state.profile.age);const r=this.num(this.state.profile.retireAge);\n    if(this.state.profile.age&&(a<40||a>100))return 'Please enter an age between 40 and 100 so the timeline makes sense.';\n    if(a&&r&&r<a&&this.state.profile.status!=='retired')return 'Your planned retirement age is earlier than your current age. If you have already retired, choose “Already retired” above.';\n    return '';}\n\n  /* ── totals ── */\n  sumRows(section,cats){let t=0;cats.forEach(c=>{const r=this.state[section][c.k];if(r&&!r.unknown)t+=this.num(r.v);});return t;}\n  essTotal(){return this.sumRows('ess',this.essCats)+this.state.customs.reduce((a,c)=>a+this.num(c.amount),0);}\n  lifeTotal(){return this.sumRows('life',this.lifeCats);}\n  incomeVal(k){const r=this.state.income[k];return r&&!r.unknown?this.num(r.v):0;}\n  incomeTotal(){return this.sumRows('income',this.incomeCats);}\n  assetVal(k){const a=this.state.assets[k];if(!a||a.unknown)return 0;if(a.mode==='range'){const r=this.ranges.find(x=>x.v===a.range);return r?r.n:0;}return this.num(a.v);}\n  bucketTotal(b){return this.assetCats.filter(c=>c.b===b).reduce((t,c)=>t+this.assetVal(c.k),0);}\n\n  metrics(){\n    const ess=this.essTotal(), life=this.lifeTotal(), inc=this.incomeTotal();\n    const coverage=ess>0?(inc/ess)*100:null;\n    const gap=ess-inc;\n    const annualGap=gap>0?gap*12:0;\n    const desired=ess+life;\n    const lifeGap=desired-inc;\n    const cash=this.bucketTotal('cash');\n    const years=annualGap>0?cash/annualGap:null;\n    return {ess,life,inc,coverage,gap,annualGap,desired,lifeGap,cash,years,market:this.bucketTotal('market'),retire:this.bucketTotal('retire'),ins:this.bucketTotal('ins')};\n  }\n\n  scenarioGap(key,m){\n    const s=this.state.shocks, p=this.state.pension;\n    if(key==='early'){\n      const bridge=m.inc-(this.incomeVal('userSS')+this.incomeVal('spouseSS')+this.incomeVal('pension')+this.incomeVal('spousePension'));\n      return m.ess-bridge;\n    }\n    if(key==='market') return m.gap;\n    if(key==='survivor'){\n      const ss=Math.max(this.incomeVal('userSS'),this.incomeVal('spouseSS'));\n      const pctv=p.pct===''?50:Math.min(100,this.num(p.pct));\n      const pen=this.incomeVal('pension')*(pctv/100);\n      const rest=this.incomeVal('annuityInc')+this.incomeVal('rental')+this.incomeVal('otherInc');\n      return (m.ess*(s.survivor.expensePct/100))-(ss+pen+rest);\n    }\n    if(key==='health') return m.gap+this.num(s.health.monthly);\n    if(key==='inflation'){\n      const f=1+s.inflation.pct/100;\n      const cola=this.incomeVal('userSS')+this.incomeVal('spouseSS')+(this.state.pension.cola==='yes'?this.incomeVal('pension'):0);\n      const flat=m.inc-cola;\n      return (m.ess*f)-(cola*f+flat);\n    }\n    if(key==='family') return m.gap+this.num(s.family.monthly);\n    return m.gap;\n  }\n  combinedGap(m){\n    const s=this.state.shocks;let ess=m.ess,inc=m.inc;\n    if(s.survivor.on){\n      ess=ess*(s.survivor.expensePct/100);\n      const pctv=this.state.pension.pct===''?50:Math.min(100,this.num(this.state.pension.pct));\n      inc=Math.max(this.incomeVal('userSS'),this.incomeVal('spouseSS'))+this.incomeVal('pension')*(pctv/100)+this.incomeVal('annuityInc')+this.incomeVal('rental')+this.incomeVal('otherInc');\n    }\n    if(s.inflation.on){\n      const f=1+s.inflation.pct/100;\n      const cola=Math.min(inc,this.incomeVal('userSS')+this.incomeVal('spouseSS')+(this.state.pension.cola==='yes'?this.incomeVal('pension'):0));\n      inc=cola*f+(inc-cola);ess=ess*f;\n    }\n    if(s.health.on)ess+=this.num(s.health.monthly);\n    if(s.family.on)ess+=this.num(s.family.monthly);\n    if(s.early.on)inc-=(this.incomeVal('userSS')+this.incomeVal('spouseSS')+this.incomeVal('pension')+this.incomeVal('spousePension'));\n    return ess-inc;\n  }\n  anyShock(){const s=this.state.shocks;return ['early','market','survivor','health','inflation','family'].some(k=>s[k].on);}\n  largestShock(m){\n    const keys=['early','market','survivor','health','inflation','family'];\n    const names={early:'early-retirement',market:'market-decline',survivor:'loss-of-a-spouse',health:'major healthcare expense',inflation:'inflation-pressure',family:'family-support'};\n    let best=null;\n    keys.forEach(k=>{if(!this.state.shocks[k].on)return;const d=this.scenarioGap(k,m)-m.gap;if(!best||d>best.d)best={k:k,d:d,name:names[k]};});\n    return best;\n  }\n\n  retirementRunwaySummary(m){\n    const miss=this.missingList().length;\n    const coverage=m.coverage||0;\n    const hasData=m.ess>0&&m.inc>0;\n    \n    if(!hasData)return {label:'More Information Needed',strengths:[],areas:[]};\n    \n    const strengths=[];\n    const areas=[];\n    \n    if(coverage>=80)strengths.push('Dependable income covers most essential expenses ('+this.pct(coverage)+').');\n    else if(coverage>=60)strengths.push('Dependable income covers a meaningful portion of essentials ('+this.pct(coverage)+').');\n    \n    if(m.cash>0)strengths.push('Liquid reserves have been identified ('+this.money(m.cash)+').');\n    \n    if(this.state.goals.length>=3)strengths.push('Clear retirement priorities have been stated.');\n    \n    const incSources=Object.values(this.state.income).filter(x=>x.v>0||x.unknown).length;\n    if(incSources>=2)strengths.push('Multiple income sources are planned.');\n    \n    if(m.gap>0){\n      if(m.gap>750)areas.push('Essential-income gap of '+this.money(m.gap)+'/mo worth exploring with a professional.');\n      else areas.push('Modest essential-income gap of '+this.money(m.gap)+'/mo — may be addressable.');\n    }\n    \n    if(m.lifeGap>0)areas.push('Lifestyle spending exceeds dependable income by '+this.money(m.lifeGap)+'/mo.');\n    \n    if(m.cash>0&&m.years!==null&&m.years<3)areas.push('Liquid reserves cover approximately '+Math.round(m.years*10)/10+' years — may be worth reviewing.');\n    \n    if(miss>0)areas.push(miss+' item(s) still marked unknown — completing these would improve accuracy.');\n    \n    const label=strengths.length>=3&&areas.length<=1?'Strong Foundation':\n                strengths.length>=2&&areas.length===0?'Generally On Track':\n                areas.length===0?'Generally On Track':'Worth Reviewing';\n    \n    return {label,strengths,areas};\n  }\n\n  personalisedRecs(m){\n    const recs=[];\n    const miss=this.missingList();\n    if(m.gap>0&&m.gap>750){\n      recs.push({title:'Review how to address your income gap',body:'Based on the information entered, your essential expenses exceed dependable income by '+this.money(m.gap)+' per month. A professional can help explore how to close this gap.'});\n    }else if(m.gap>0){\n      recs.push({title:'Evaluate your essential-income gap',body:'Your essential expenses exceed dependable income by '+this.money(m.gap)+' per month. This may be addressable through additional income, expense adjustment, or asset strategy.'});\n    }\n    if(m.lifeGap>0&&m.lifeGap>500){\n      recs.push({title:'Plan for your lifestyle spending',body:'Your desired lifestyle spending exceeds dependable income by '+this.money(m.lifeGap)+' per month. Review whether this gap can be met through accessible savings.'});\n    }\n    if(this.state.concerns.indexOf('market')>=0||this.state.concerns.indexOf('runout')>=0){\n      if(!this.anyShock()){recs.push({title:'Test your plan against changes',body:'You expressed concern about market volatility or longevity. The Shock Lab can show how your plan responds to common retirement scenarios.'});}\n    }\n    if(m.cash>0&&m.years!==null&&m.years<3){\n      recs.push({title:'Strengthen your liquid reserves',body:'Your liquid assets could cover approximately '+Math.round(m.years*10)/10+' years of essential expenses. Review whether you want a longer emergency fund.'});\n    }\n    if(miss.length>3){\n      recs.push({title:'Complete key information',body:'Several items are marked unknown. Filling these in would give you a more accurate picture of your retirement readiness.'});\n    }\n    if(!recs.length){\n      recs.push({title:'Continue planning with a professional',body:'Your information is fairly complete. A retirement-income professional can help you evaluate strategies aligned with your stated priorities.'});\n    }\n    return recs.slice(0,3);\n  }\n\n  missingList(){\n    const out=[];const st=this.state;\n    if(st.pension.pct===''&&this.incomeVal('pension')>0)out.push('Pension survivor percentage');\n    if(st.pension.cola===''&&this.incomeVal('pension')>0)out.push('Whether your pension adjusts for inflation');\n    this.essCats.forEach(c=>{if(st.ess[c.k].unknown)out.push(c.label+' (essential expense)');});\n    this.lifeCats.forEach(c=>{if(st.life[c.k].unknown)out.push(c.label+' (lifestyle expense)');});\n    this.incomeCats.forEach(c=>{if(st.income[c.k].unknown)out.push(c.label);});\n    this.assetCats.forEach(c=>{if(st.assets[c.k].unknown)out.push(c.label);});\n    if(st.liq.choice==='unsure'||st.liq.choice==='')out.push('How much you want kept readily accessible');\n    if(!st.liq.items.some(i=>i.type==='Healthcare'))out.push('Estimated future healthcare costs');\n    return out;\n  }\n\n  status gn({},x.milestoneEdits,{[d.k]:e.target.value.replace(/[^0-9]/g,'')})}))};\n    });\n\n    /* action plan */\n    const supported=[];\n    if(m.coverage!==null&&m.coverage>=70)supported.push('Most essential expenses are covered by the dependable income you entered ('+covText+').');\n    if(m.cash>0)supported.push('A liquid reserve of '+this.money(m.cash)+' has been identified for emergencies and flexibility.');\n    if(st.pension.survivor==='yes')supported.push('Survivor income from your pension has been considered in your household plan.');\n    if(st.couple.mode==='together')supported.push('You and your partner have aligned on retirement priorities and concerns.');\n    if(st.goals.length>=3)supported.push('Your key retirement priorities are clearly defined.');\n    if(!supported.length)supported.push('Keep going — once expenses and income are entered, your strengths will appear here.');\n    const clarify=miss.slice(0,5).map(x=>'Confirm: '+x+'.');\n    if(st.pension.cola!=='yes'&&this.incomeVal('pension')>0)clarify.unshift('Confirm whether your pension adjusts for inflation.');\n    if(!clarify.includes('Identify which assets are immediately accessible without penalty.'))clarify.push('Identify which assets are immediately accessible without penalty.');\n    const discuss=['Review how to address your estimated essential-income gap of '+(m.gap>0?this.money(m.gap):'$0')+' per month','Determine how much liquidity to preserve for comfort and unexpected costs','Discuss how survivor income may change if one household member passes','Review whether your existing accounts align with your retirement priorities','Consider whether an existing annuity or insurance should be reviewed','Understand how income sources interact with taxes during retirement'];\n    v.planSections=[\n      {title:'What appears supported',border:'#9CD3B8',swatch:'#3BA776',items:supported.map(t=>({mark:'✓',text:t}))},\n      {title:'What needs clarification',border:'#F0D38C',swatch:'#E0B143',items:clarify.map(t=>({mark:'?',text:t}))},\n      {title:'Topics to discuss with a professional',border:'#DDE3EF',swatch:'#0E2148',items:discuss.map(t=>({mark:'→',text:t}))}\n    ];\n\n    /* review */\n    v.reviewRows=[\n      {label:'Household',value:(p.firstName||'—')+' · age '+(p.age||'—')+' · '+(p.marital||'status not set'),edit:()=>this.go('household')},\n      {label:'Retirement timing',value:'Planned age '+(p.retireAge||'—')+' · '+(p.status||'status not set'),edit:()=>this.go('household')},\n      {label:'Priorities and concerns',value:st.goals.length+' priorities · '+st.concerns.length+' concerns',edit:()=>this.go('vision')},\n      {label:'Essential expenses',value:this.money(m.ess)+' per month',edit:()=>this.go('essentials')},\n      {label:'Lifestyle expenses',value:this.money(m.life)+' per month',edit:()=>this.go('lifestyle')},\n      {label:'Dependable income',value:this.money(m.inc)+' per month',edit:()=>this.go('income')},\n      {label:'Resources',value:this.money(m.cash+m.retire+m.market+m.ins)+' entered',edit:()=>this.go('resources')},\n      {label:'Liquidity preference',value:st.liq.choice||'Not entered',edit:()=>this.go('liquidity')},\n      {label:'Priority ranking',value:st.order.slice(0,3).map(short).join(', '),edit:()=>this.go('priorities')},\n      {label:'Couple Mode',value:st.couple.mode||'Not entered',edit:()=>this.go('couple')},\n      {label:'Shock Lab',value:this.anyShock()?'Scenarios active':'No scenarios active',edit:()=>this.go('shocks')}\n    ];\n\n    /* report */\n    v.reportMeta='Prepared for '+(p.firstName||'this household')+' · '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+' · Summary preview';\n    v.reportSections=[\n      {title:'Household snapshot',rows:[{k:'Name',v:p.firstName||'—'},{k:'Age',v:p.age||'—'},{k:'Status',v:p.status||'—'},{k:'Spouse or partner age',v:p.spouseAge||'—'},{k:'State',v:p.state||'—'},{k:'Home',v:p.home||'—'}]},\n      {title:'Retirement timeline',rows:[{k:'Planned retirement age',v:p.retireAge||'—'},{k:'Social Security start (placeholder)',v:'67'},{k:'RMD age placeholder',v:'73'}]},\n      {title:'Essential and lifestyle expenses',rows:[{k:'Essential monthly',v:this.money(m.ess)},{k:'Lifestyle monthly',v:this.money(m.life)},{k:'Total desired monthly',v:this.money(m.desired)},{k:'Total desired annual',v:this.money(m.desired*12)}]},\n      {title:'Dependable income sources',rows:this.incomeCats.filter(c=>this.incomeVal(c.k)>0||st.income[c.k].unknown).map(c=>({k:c.label,v:st.income[c.k].unknown?'Unknown':this.money(this.incomeVal(c.k))})).concat([{k:'Total dependable monthly',v:this.money(m.inc)}])},\n      {title:'Income coverage',rows:[{k:'Essential coverage',v:covText},{k:m.gap>0?'Monthly essential gap':'Monthly essential surplus',v:this.money(Math.abs(m.gap))},{k:'Annual essential gap',v:this.money(m.annualGap)},{k:'Desired lifestyle gap',v:m.lifeGap>0?this.money(m.lifeGap):'$0'}]},\n      {title:'Available resources',rows:this.buckets.map(b=>({k:b.title,v:this.money(this.bucketTotal(b.b))}))},\n      {title:'Liquidity preferences',rows:[{k:'Target reserve',v:st.liq.choice||'Not entered'},{k:'Planned large expenses',v:st.liq.items.length?st.liq.items.map(i=>i.type+' '+this.money(this.num(i.amount))).join('; '):'None entered'}]},\n      {title:'Priority ranking',rows:st.order.map((k,i)=>({k:'#'+(i+1),v:label(k)}))},\n      {title:'Couple Mode comparison',rows:v.isPartnered?[{k:'Mode',v:st.couple.mode||'Not entered'},{k:'Closely aligned',v:this.alignCount()+' of 7'},{k:'Shared leading priorities',v:sharedTop.length+' of 4'}]:[{k:'Mode',v:'Single household — not applicable'}]},\n      {title:'Shock Lab results',rows:['early','market','survivor','health','inflation','family'].map(k=>({k:{early:'Retire earlier',market:'Market decline',survivor:'Loss of one spouse',health:'Healthcare expense',inflation:'Inflation pressure',family:'Family support'}[k],v:sh[k].on?('Gap '+this.money(Math.max(0,this.scenarioGap(k,m)))):'Not tested'}))},\n      {title:'Missing information',rows:(miss.length?miss:['Nothing marked unknown']).map((x,i)=>({k:'Item '+(i+1),v:x}))},\n      {title:'Questions for a professional review',rows:discuss.slice(0,4).map((x,i)=>({k:'Q'+(i+1),v:x}))}\n    ];\n    v.doPdf=()=>window.print();\n\n    /* advisor */\n    const c=st.contact;\n    v.advisorOpts=mkOpts([{v:'schedule',label:'Schedule a Retirement Runway Review'},{v:'question',label:'Ask a Question'},{v:'annuity',label:'Review an Existing Annuity'},{v:'none',label:'Finish Without Scheduling'}],c.intent,x=>{this.set('contact',{intent:x});if(x==='none')this.go('done');else this.go('results');});\n    v.goToResultsForm=()=>this.go('results');\n\n    /* done */\n    v.doneSummary=ready?('Your entries show '+covText+' of essential expenses covered by dependable income, '+(m.gap>0?('a '+this.money(m.gap)+' monthly essential gap'):'no monthly essential gap')+', and '+miss.length+' item(s) still marked unknown.'):'Expense and income information has not been entered yet, so no results were calculated. You can edit your answers at any time to build your runway.';\n\n    /* dialogs */\n    const d=st.dialog;\n    v.dialogOpen=!!d;\n    v.toast=st.toast;\n    v.dialogCancel=()=>this.setState({dialog:''});\n    v.dialogCancelLabel='Close';\n    v.dialogConfirmLabel='Got it';\n    v.dialogConfirm=()=>this.setState({dialog:''});\n    v.dialogTitle='';v.dialogBody='';\n    if(d.indexOf('explain:')===0){const [t,b]=this.explainText(d.slice(8));v.dialogTitle=t;v.dialogBody=b;}\n    v.dialogNarrow=false;\n    v.dialogWidth='380px';v.dialogPadding='24px';v.dialogTitleSize='22px';v.dialogActionsDir='column';v.dialogActionsGap='';\n    if(d==='exit'){v.dialogTitle='Leave the assessment?';v.dialogBody='Unsaved information will be cleared when you leave. You\\u2019ll return to the Skyway home screen.';v.dialogConfirmLabel='Leave assessment';v.dialogCancelLabel='Keep going';v.dialogConfirm=()=>{this.setState({dialog:''});this.resetAll();};v.dialogNarrow=true;v.dialogWidth='340px';v.dialogPadding='26px 22px';v.dialogTitleSize='20px';v.dialogActionsDir='row';v.dialogActionsGap='10px';}\n    if(d==='reset'){v.dialogTitle='Clear all your answers?';v.dialogBody='This removes every amount, selection, and scenario you entered in this session. It cannot be undone.';v.dialogConfirmLabel='Yes, clear everything';v.dialogCancelLabel='Keep my answers';v.dialogConfirm=this.resetAll;}\n    v.askExit=()=>this.setState({dialog:'exit'});\n    v.askReset=()=>this.setState({dialog:'reset'});\n    v.loadSample=this.loadSample;\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
